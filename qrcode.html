<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมสร้าง QR Code - โรงพยาบาลพระอาจารย์มั่น ภูริทัตโต</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- โหลด QRCode Library จาก CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --primary: #047857;
            --primary-hover: #065f46;
            --bg-color: #f0fdf4;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #334155;
            --border: #cbd5e1;
        }

        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { 
            background: linear-gradient(135deg, #065f46 0%, #047857 50%, #064e3b 100%);
            margin: 0; padding: 20px; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; color: var(--text-main); 
        }

        .generator-card {
            background: var(--card-bg); width: 100%; max-width: 500px;
            border-radius: 24px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border: 2px solid rgba(255,255,255,0.2); text-align: center;
        }

        .header-icon {
            font-size: 48px; color: var(--primary); margin-bottom: 10px;
        }

        h2 { margin: 0 0 6px 0; color: var(--primary); font-size: 22px; }
        p { margin: 0 0 24px 0; color: var(--text-sub); font-size: 14px; }

        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 14px; color: var(--text-main); }
        
        input[type="text"], select {
            width: 100%; padding: 12px 16px; font-size: 16px; border: 2px solid var(--border);
            border-radius: 12px; outline: none; transition: 0.2s; font-weight: 500;
        }
        input[type="text"]:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.15); }

        .btn {
            background: var(--primary); color: #fff; border: none; padding: 14px 20px;
            font-size: 16px; font-weight: 700; border-radius: 12px; cursor: pointer; width: 100%;
            box-shadow: 0 4px 12px rgba(4, 120, 87, 0.3); transition: 0.2s; display: flex;
            align-items: center; justify-content: center; gap: 8px;
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

        .qr-output-container {
            margin-top: 25px; padding: 20px; background: #f8fafc; border-radius: 16px;
            border: 2px dashed var(--border); display: none; flex-direction: column; align-items: center; gap: 15px;
        }

        #qrcode {
            background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            display: inline-block;
        }
        #qrcode img { display: block; margin: 0 auto; }

        .btn-download {
            background: #0284c7; color: #fff; text-decoration: none; padding: 10px 20px;
            border-radius: 10px; font-size: 14px; font-weight: 700; display: inline-flex;
            align-items: center; gap: 6px; box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
            transition: 0.2s; cursor: pointer; border: none;
        }
        .btn-download:hover { background: #0369a1; }
    </style>
</head>
<body>

    <div class="generator-card">
        <div class="header-icon"><i class="fa-solid fa-qrcode"></i></div>
        <h2>ระบบสร้าง QR Code</h2>
        <p>โรงพยาบาลพระอาจารย์มั่น ภูริทัตโต</p>

        <div class="form-group">
            <label>เลือกทางลัด (ระบบคิวหลัก)</label>
            <select id="presetSelect" onchange="fillPresetUrl()">
                <option value="">-- เลือกเว็บไซต์ในระบบ --</option>
                <option value="https://nopphawinchi-ux.github.io/thai-med-monitor/ttmqueue">ลงทะเบียนคิวแพทย์แผนไทยและสปา (ttmqueue)</option>
                <option value="https://nopphawinchi-ux.github.io/thai-med-monitor/ptqueue.html">ลงทะเบียนคิวแพทย์แผนจีน (ptqueue)</option>
                <option value="https://nopphawinchi-ux.github.io/thai-med-monitor/docqueue.html">หน้าจอจัดการคิวเจ้าหน้าที่ (DocQueue)</option>
                <option value="https://nopphawinchi-ux.github.io/thai-med-monitor/adminmonitor.html">หน้าจอ Admin Monitor</option>
            </select>
        </div>

        <div class="form-group">
            <label>ลิงก์ URL หรือข้อความที่ต้องการสร้าง QR Code</label>
            <input type="text" id="textInput" placeholder="https://example.com หรือข้อความของคุณ">
        </div>

        <button class="btn" onclick="generateQRCode()"><i class="fa-solid fa-wand-magic-sparkles"></i> สร้าง QR Code</button>

        <div id="qrOutput" class="qr-output-container">
            <div style="font-size: 14px; font-weight: 700; color: var(--primary);">สแกนเพื่อใช้งาน</div>
            <div id="qrcode"></div>
            <button id="downloadBtn" class="btn-download" onclick="downloadQRCode()"><i class="fa-solid fa-download"></i> ดาวน์โหลดรูปภาพ QR Code</button>
        </div>
    </div>

    <script>
        let qrInstance = null;

        function fillPresetUrl() {
            let select = document.getElementById('presetSelect');
            if (select.value) {
                document.getElementById('textInput').value = select.value;
                generateQRCode();
            }
        }

        function generateQRCode() {
            let text = document.getElementById('textInput').value.trim();
            let container = document.getElementById('qrOutput');
            let qrcodeElement = document.getElementById('qrcode');

            if (!text) {
                alert('กรุณากรอกลิงก์หรือข้อความที่ต้องการสร้าง QR Code');
                return;
            }

            // ล้าง QR Code เก่าถ้ามี
            qrcodeElement.innerHTML = "";
            container.style.display = "flex";

            // สร้าง QR Code ใหม่ขนาด 220x220 พิกเซล
            qrInstance = new QRCode(qrcodeElement, {
                text: text,
                width: 220,
                height: 220,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function downloadQRCode() {
            let img = document.querySelector('#qrcode img');
            if (!img) {
                // กรณีที่ไลบรารีเรนเดอร์เป็น canvas
                let canvas = document.querySelector('#qrcode canvas');
                if (canvas) {
                    let imageURL = canvas.toDataURL("image/png");
                    triggerDownload(imageURL);
                    return;
                }
                alert('ไม่พบรูปภาพ QR Code กรุณากดสร้างใหม่อีกครั้ง');
                return;
            }
            triggerDownload(img.src);
        }

        function triggerDownload(url) {
            let a = document.createElement('a');
            a.href = url;
            a.download = 'hospital-qrcode.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
