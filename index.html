<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commander Panel - ระบบสั่งการหัตถการ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --app-orange: #ff7a00;
            --app-orange-hover: #e56d00;
            --app-purple: #3d1c4f;
            --app-bg: #f4f5f8;
            --app-card: #ffffff;
            --app-text: #2d2d2d;
            --app-gray: #8e8e93;
            --app-border: #e2e2e8;
        }

        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { background: var(--app-bg); margin: 0; padding: 25px; min-height: 100vh; color: var(--app-text); }

        .header-title {
            text-align: center; margin-bottom: 25px; color: var(--app-purple); font-weight: 700; font-size: 26px;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }

        .main-container { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 1.25fr 1fr; gap: 24px; }
        @media(max-width: 950px) { .main-container { grid-template-columns: 1fr; } }
        
        .panel { 
            background: var(--app-card); padding: 25px; border-radius: 24px; 
            box-shadow: 0 10px 30px rgba(61, 28, 79, 0.06); border: 1px solid var(--app-border);
        }

        .panel-header { 
            font-size: 18px; font-weight: 600; color: var(--app-purple); margin-bottom: 20px; 
            border-bottom: 2px solid var(--app-bg); padding-bottom: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 4px; }
        .form-group.full { grid-column: span 2; }
        
        label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 13px; color: var(--app-gray); }
        label i { margin-right: 6px; color: var(--app-orange); }
        
        input, select { 
            width: 100%; padding: 12px 14px; border: 2px solid var(--app-border); border-radius: 14px; 
            font-size: 14px; background: #fafafa; color: var(--app-text); outline: none; transition: 0.2s;
        }
        input:focus, select:focus { border-color: var(--app-orange); background: #fff; box-shadow: 0 0 0 4px rgba(255, 122, 0, 0.1); }
        
        .badge-selector { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
        .badge-option { 
            background: #f0f0f3; border: 1px solid transparent; padding: 8px 14px; border-radius: 16px; 
            font-size: 13px; cursor: pointer; user-select: none; font-weight: 500; color: #555; transition: 0.2s;
        }
        .badge-option:hover { background: #e4e4e9; }
        .badge-option.selected { background: var(--app-orange); color: white; }
        .badge-option.danger-badge.selected { background: #ff3b30; color: white; }
        .badge-option.time-badge.selected { background: var(--app-purple); color: white; }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-submit { 
            flex: 1; background: linear-gradient(135deg, var(--app-orange) 0%, var(--app-orange-hover) 100%); 
            color: white; border: none; padding: 15px; border-radius: 14px; font-size: 15px; font-weight: 700; 
            cursor: pointer; box-shadow: 0 6px 20px rgba(255, 122, 0, 0.3); transition: 0.2s;
        }
        .btn-waitlist { 
            flex: 1; background: linear-gradient(135deg, #6200ee 0%, #3d1c4f 100%); 
            color: white; border: none; padding: 15px; border-radius: 14px; font-size: 15px; font-weight: 700; 
            cursor: pointer; box-shadow: 0 6px 20px rgba(98, 0, 238, 0.3); transition: 0.2s;
        }
        .btn-submit:hover, .btn-waitlist:hover { opacity: 0.92; transform: translateY(-1px); }
        
        .queue-list { display: flex; flex-direction: column; gap: 12px; max-height: 620px; overflow-y: auto; padding-right: 4px; }
        .queue-item { 
            background: #fafafc; border: 1px solid var(--app-border); border-radius: 16px; padding: 16px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .queue-info h4 { margin: 0 0 4px 0; color: var(--app-purple); font-size: 16px; font-weight: 700; }
        .queue-info p { margin: 2px 0; font-size: 13px; color: var(--app-gray); }
        
        .queue-actions { display: flex; gap: 8px; }
        .btn-action { padding: 8px 12px; border-radius: 10px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn-edit { background: rgba(255, 149, 0, 0.15); color: #b26500; }
        .btn-delete { background: rgba(255, 59, 48, 0.15); color: #d32f2f; }

        .link-monitor { font-size: 14px; color: var(--app-orange); text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .link-monitor:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="header-title">
        <i class="fa-solid fa-hospital-user" style="color: var(--app-orange);"></i> ระบบสั่งการหัตถการแพทย์แผนไทย (Online)
    </div>

    <div class="main-container">
        <!-- ฟอร์มกรอกข้อมูล -->
        <div class="panel">
            <div class="panel-header">
                <span><i class="fa-regular fa-id-card"></i> บันทึกข้อมูลเคสใหม่</span>
                <a href="monitor.html" target="_blank" class="link-monitor"><i class="fa-solid fa-external-link-alt"></i> เปิดมอนิเตอร์</a>
            </div>
            
            <input type="hidden" id="edit-key" value="">

            <div class="form-grid">
                <!-- เตียง 12 เตียงครบถ้วน -->
                <div class="form-group">
                    <label><i class="fa-solid fa-bed"></i> เลขที่เตียง (12 เตียง)</label>
                    <select id="input-bed">
                        <option value="" disabled selected>-- เลือกเตียง --</option>
                        <optgroup label="General Beds">
                            <option value="BED 1">BED 1</option><option value="BED 2">BED 2</option>
                            <option value="BED 3">BED 3</option><option value="BED 4">BED 4</option>
                            <option value="BED 5">BED 5</option><option value="BED 6">BED 6</option>
                            <option value="BED 7">BED 7</option><option value="BED 8">BED 8</option>
                        </optgroup>
                        <optgroup label="VIP Beds">
                            <option value="VIP 1">VIP 1</option><option value="VIP 2">VIP 2</option>
                        </optgroup>
                        <optgroup label="SPA Beds">
                            <option value="SPA 1">SPA 1</option><option value="SPA 2">SPA 2</option>
                        </optgroup>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-barcode"></i> HN ผู้ป่วย</label>
                    <input type="text" id="input-hn" placeholder="เช่น 6701234">
                </div>
                <div class="form-group full">
                    <label><i class="fa-solid fa-user-circle"></i> ชื่อ-นามสกุล ผู้ป่วย</label>
                    <input type="text" id="input-pname" placeholder="เช่น นายสมชาย ใจดี">
                </div>
                
                <!-- วินิจฉัย 16 รายการครบถ้วน -->
                <div class="form-group full">
                    <label><i class="fa-solid fa-stethoscope"></i> วินิจฉัย (Diagnosis)</label>
                    <select id="input-diagnosis">
                        <option value="" disabled selected>-- เลือกการวินิจฉัย --</option>
                        <option value="ส.1 หลัง">ส.1 หลัง</option>
                        <option value="ส.3 หลัง">ส.3 หลัง</option>
                        <option value="ส.4 หลัง">ส.4 หลัง</option>
                        <option value="ส.5 หลัง">ส.5 หลัง</option>
                        <option value="จับโปงเข่า">จับโปงเข่า</option>
                        <option value="จับโปงข้อเท้า">จับโปงข้อเท้า</option>
                        <option value="ยอกเดี่ยว/คู่">ยอกเดี่ยว/คู่</option>
                        <option value="คอตกหมอน/โค้งคอ">คอตกหมอน/โค้งคอ</option>
                        <option value="ลมปลายปัตฆาตอื่น">ลมปลายปัตฆาตอื่น</option>
                        <option value="นิ้วล็อค">นิ้วล็อค</option>
                        <option value="ลมปะกัง">ลมปะกัง</option>
                        <option value="อัมพฤกษ์/อัมพาต">อัมพฤกษ์/อัมพาต</option>
                        <option value="หัวไหล่ติด">หัวไหล่ติด</option>
                        <option value="ข้อเท้าแพลง">ข้อเท้าแพลง</option>
                        <option value="รองช้ำ">รองช้ำ</option>
                        <option value="ส่งเสริมสุขภาพ">ส่งเสริมสุขภาพ</option>
                    </select>
                </div>

                <!-- ระยะเวลาทำหัตถการ -->
                <div class="form-group full">
                    <label><i class="fa-solid fa-clock"></i> ระยะเวลาทำหัตถการ</label>
                    <div class="badge-selector" id="group-time">
                        <div class="badge-option time-badge selected" onclick="selectTime(this, 30)">30 นาที</div>
                        <div class="badge-option time-badge" onclick="selectTime(this, 60)">60 นาที</div>
                        <div class="badge-option time-badge" onclick="selectTime(this, 120)">120 นาที</div>
                    </div>
                    <input type="hidden" id="input-duration" value="30">
                </div>

                <!-- โรคประจำตัว -->
                <div class="form-group full">
                    <label><i class="fa-solid fa-heart-pulse"></i> โรคประจำตัว</label>
                    <div class="badge-selector" id="group-disease">
                        <div class="badge-option" onclick="toggleMultiSelect(this)">เบาหวาน (DM)</div>
                        <div class="badge-option" onclick="toggleMultiSelect(this)">ความดันโลหิตสูง (HT)</div>
                        <div class="badge-option" onclick="toggleMultiSelect(this)">โรคไตเรื้อรัง (CKD)</div>
                        <div class="badge-option" onclick="toggleMultiSelect(this)">โรคหัวใจ</div>
                        <div class="badge-option" onclick="toggleMultiSelect(this)">โรคหลอดเลือดสมอง</div>
                    </div>
                </div>

                <div class="form-group full">
                    <label><i class="fa-solid fa-triangle-exclamation" style="color:#ff3b30;"></i> ข้อควรระวังพิเศษ</label>
                    <div class="badge-selector" id="group-caution">
                        <div class="badge-option danger-badge" onclick="toggleMultiSelect(this)">แพ้ยานวด/สมุนไพร</div>
                        <div class="badge-option danger-badge" onclick="toggleMultiSelect(this)">ระวังเลือดออกง่าย</div>
                        <div class="badge-option danger-badge" onclick="toggleMultiSelect(this)">เสี่ยงพลัดตกหกล้ม</div>
                    </div>
                </div>

                <!-- หัตถการ 8 รายการครบถ้วน -->
                <div class="form-group">
                    <label><i class="fa-solid fa-hand-holding-medical"></i> หัตถการ</label>
                    <select id="input-proc-type">
                        <option value="" disabled selected>-- เลือกหัตถการ --</option>
                        <option value="นวดและประคบ">1 นวดและประคบ</option>
                        <option value="นวดรักษา">2 นวดรักษา</option>
                        <option value="ประคบ">3 ประคบ</option>
                        <option value="อบสมุนไพร">4 อบสมุนไพร</option>
                        <option value="พอกยา">5 พอกยา</option>
                        <option value="ทับหม้อเกลือ">6 ทับหม้อเกลือ</option>
                        <option value="สปา">7 สปา</option>
                        <option value="ฝังเข็มแพทย์แผนจีน">8 ฝังเข็มแพทย์แผนจีน</option>
                    </select>
                </div>

                <!-- อวัยวะครบถ้วน รวมถึง ทั่วร่างกาย -->
                <div class="form-group">
                    <label><i class="fa-solid fa-child-reaching"></i> อวัยวะ</label>
                    <select id="input-proc-organ">
                        <option value="" disabled selected>-- เลือกอวัยวะ --</option>
                        <option value="ศีรษะ">ศีรษะ</option>
                        <option value="บ่าไหล่">บ่าไหล่</option>
                        <option value="แขน">แขน</option>
                        <option value="นิ้วมือ">นิ้วมือ</option>
                        <option value="ข้อศอก">ข้อศอก</option>
                        <option value="หลัง">หลัง</option>
                        <option value="เอวสะโพก">เอวสะโพก</option>
                        <option value="ขา">ขา</option>
                        <option value="น่อง">น่อง</option>
                        <option value="เข่า">เข่า</option>
                        <option value="เท้า">เท้า</option>
                        <option value="ทั่วร่างกาย">ทั่วร่างกาย</option>
                    </select>
                </div>

                <!-- ผู้ทำหัตถการ 12 ท่านครบถ้วน -->
                <div class="form-group full">
                    <label><i class="fa-solid fa-user-doctor"></i> ผู้ทำหัตถการ</label>
                    <select id="input-operator">
                        <option value="" disabled selected>-- เลือกผู้ปฏิบัติงาน --</option>
                        <option value="กรชกร พองผาลา">1.กรชกร พองผาลา</option>
                        <option value="สุประภา มาละอินทร์">2.สุประภา มาละอินทร์</option>
                        <option value="พรวินิจ แก้วอัคฮาด">3.พรวินิจ แก้วอัคฮาด</option>
                        <option value="พรสิน เฮียงราช">4.พรสิน เฮียงราช</option>
                        <option value="พฤษาพันธ์ บุบผาลา">5.พฤษาพันธ์ บุบผาลา</option>
                        <option value="จิรวัฒณ์ สีตาแสน">6.จิรวัฒณ์ สีตาแสน</option>
                        <option value="ฐิติมา บุญแฮด">7.ฐิติมา บุญแฮด</option>
                        <option value="ฉัตรลดา หงษ์วิลัย">8.ฉัตรลดา หงษ์วิลัย</option>
                        <option value="ประกายรัตน์ กาลสุข">9.ประกายรัตน์ กาลสุข</option>
                        <option value="นพวินทร์ จิรศศิภิรมย์">10.นพวินทร์ จิรศศิภิรมย์</option>
                        <option value="สุนิสา อินทะเสย์">11.สุนิสา อินทะเสย์</option>
                        <option value="นายแพทย์กฤตธนัท วงค์วิเศษ">12.นายแพทย์กฤตธนัท วงค์วิเศษ</option>
                    </select>
                </div>
            </div>

            <!-- ปุ่มบันทึก 2 แบบ -->
            <div class="btn-group">
                <button class="btn-submit" onclick="savePatient('active')">
                    <i class="fa-solid fa-paper-plane"></i> ส่งทำหัตถการ
                </button>
                <button class="btn-waitlist" onclick="savePatient('waiting')">
                    <i class="fa-solid fa-clock-rotate-left"></i> บันทึกรอคอย
                </button>
            </div>
        </div>

        <!-- รายการที่ส่งแล้ว -->
        <div class="panel">
            <div class="panel-header">
                <span><i class="fa-solid fa-list-check"></i> รายการที่กำลังปฏิบัติงาน / รอคิว</span>
                <span id="queueCount" style="font-size: 13px; color: var(--app-gray);">(0 เคส)</span>
            </div>
            <div class="queue-list" id="commanderQueueList">
                <div style="text-align: center; color: var(--app-gray); padding: 50px;">กำลังโหลดข้อมูล...</div>
            </div>
        </div>
    </div>

    <script>
 	// กำหนดค่า Firebase Config ของคุณที่นี่ (ให้ตรงกับหน้า Commander)
        const firebaseConfig = {
            	apiKey: "AIzaSyDY8iVK3odMUspUk4gSrzzwJUvx2EycCyg",
    		authDomain: "thai-med-monitor.firebaseapp.com",
    		projectId: "thai-med-monitor",
    		storageBucket: "thai-med-monitor.firebasestorage.app",
    		messagingSenderId: "894864632905",
    		appId: "1:894864632905:web:521452d40ea00653a72398",
    		measurementId: "G-7SXZRHE5F9"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const queueRef = database.ref('patientQueue');

        let currentQueueData = {};

        function toggleMultiSelect(element) {
            element.classList.toggle('selected');
        }

        function selectTime(element, minutes) {
            document.querySelectorAll('#group-time .badge-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById('input-duration').value = minutes;
        }

        function generateUniqueAvatar(name) {
            const colors = ['#ff7a00', '#3d1c4f', '#6200ee', '#03dac6', '#cf6679'];
            const bg = colors[name.length % colors.length];
            const initials = name.replace(/^\d+\./, '').trim().substring(0, 2);
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
                <rect width="100" height="100" fill="${bg}"/>
                <circle cx="50" cy="38" r="20" fill="#ffffff" opacity="0.95"/>
                <path d="M 20 85 Q 20 60 50 60 Q 80 60 80 85 Z" fill="#ffffff" opacity="0.95"/>
                <text x="50" y="44" font-size="20" font-family="Prompt" font-weight="bold" fill="${bg}" text-anchor="middle">${initials}</text>
            </svg>`;
            return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
        }

        function savePatient(statusType) {
            const bed = document.getElementById('input-bed').value;
            const hn = document.getElementById('input-hn').value;
            const pname = document.getElementById('input-pname').value;
            const diagnosis = document.getElementById('input-diagnosis').value;
            const duration = parseInt(document.getElementById('input-duration').value) || 30;
            const procType = document.getElementById('input-proc-type').value;
            const procOrgan = document.getElementById('input-proc-organ').value;
            const operator = document.getElementById('input-operator').value;
            const editKey = document.getElementById('edit-key').value;

            if (!bed || !pname || !procType || !procOrgan || !operator) {
                alert('กรุณากรอกข้อมูลสำคัญให้ครบถ้วน');
                return;
            }

            let diseases = [];
            document.querySelectorAll('#group-disease .badge-option.selected').forEach(el => diseases.push(el.innerText));
            let cautions = [];
            document.querySelectorAll('#group-caution .badge-option.selected').forEach(el => cautions.push(el.innerText));

            const patientData = {
                bed,
                hn: hn || '-----',
                pname,
                diagnosis: diagnosis || 'ไม่ระบุ',
                disease: diseases.length > 0 ? diseases.join(', ') : 'ไม่มี',
                caution: cautions.length > 0 ? cautions.join(', ') : 'ไม่มี',
                procedure: `${procType} (${procOrgan})`,
                operator: operator,
                durationMinutes: duration,
                endTime: Date.now() + (duration * 60 * 1000),
                timestamp: 0 - Date.now(),
                status: statusType,
                avatar: generateUniqueAvatar(operator)
            };

            if (editKey === "") {
                queueRef.push(patientData);
            } else {
                queueRef.child(editKey).set(patientData);
                document.getElementById('edit-key').value = "";
            }

            resetForm();
        }

        queueRef.orderByChild('timestamp').on('value', (snapshot) => {
            currentQueueData = snapshot.val() || {};
            const listEl = document.getElementById('commanderQueueList');
            let keys = Object.keys(currentQueueData);
            document.getElementById('queueCount').innerText = `(${keys.length} เคส)`;

            if (keys.length === 0) {
                listEl.innerHTML = `<div style="text-align: center; color: var(--app-gray); padding: 50px;">ยังไม่มีรายการ</div>`;
                return;
            }

            let html = '';
            keys.forEach((key) => {
                let p = currentQueueData[key];
                let badgeStatus = p.status === 'waiting' ? '<span style="color:#6200ee; font-weight:bold;">[รอคิว]</span>' : '<span style="color:#ff7a00; font-weight:bold;">[ทำหัตถการ]</span>';
                html += `
                    <div class="queue-item">
                        <div class="queue-info">
                            <h4>${badgeStatus} <b>[${p.bed}]</b> ${p.pname}</h4>
                            <p>หัตถการ: ${p.procedure} | ผู้ทำ: ${p.operator}</p>
                        </div>
                        <div class="queue-actions">
                            <button class="btn-action btn-edit" onclick="editPatient('${key}')">แก้ไข</button>
                            <button class="btn-action btn-delete" onclick="removePatient('${key}')">ลบ</button>
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        });

        function editPatient(key) {
            let p = currentQueueData[key];
            if (!p) return;

            document.getElementById('input-bed').value = p.bed;
            document.getElementById('input-hn').value = p.hn === '-----' ? '' : p.hn;
            document.getElementById('input-pname').value = p.pname;
            document.getElementById('input-diagnosis').value = p.diagnosis;
            document.getElementById('input-operator').value = p.operator;
            document.getElementById('edit-key').value = key;
        }

        function removePatient(key) {
            queueRef.child(key).remove();
        }

        function resetForm() {
            document.getElementById('input-bed').selectedIndex = 0;
            document.getElementById('input-hn').value = '';
            document.getElementById('input-pname').value = '';
            document.getElementById('input-diagnosis').selectedIndex = 0;
            document.getElementById('input-proc-type').selectedIndex = 0;
            document.getElementById('input-proc-organ').selectedIndex = 0;
            document.getElementById('input-operator').selectedIndex = 0;
            document.getElementById('edit-key').value = "";
            document.querySelectorAll('.badge-option').forEach(el => el.classList.remove('selected'));
            document.querySelector('.time-badge').classList.add('selected');
            document.getElementById('input-duration').value = "30";
        }
    </script>
</body>
</html>
