<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Treatment Dashboard - จอมอนิเตอร์หัตถการ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --app-bg: #130b1a;
            --app-card: rgba(45, 27, 61, 0.85);
            --app-orange: #ff7a00;
            --app-purple: #7b2cbf;
            --app-green: #30d158;
            --app-red: #ff453a;
            --app-border: rgba(255, 122, 0, 0.2);
        }

        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { 
            background: radial-gradient(circle at 50% 0%, #29153d 0%, var(--app-bg) 100%); 
            margin: 0; padding: 24px; min-height: 100vh; color: #fff; 
        }
        
        .header-container {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; background: rgba(30, 15, 45, 0.9); backdrop-filter: blur(20px);
            padding: 14px 24px; border-radius: 20px; border: 1px solid var(--app-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); flex-wrap: wrap; gap: 15px;
        }

        .header-title { color: #fff; font-weight: 700; font-size: 22px; display: flex; align-items: center; gap: 12px; margin: 0; }
        
        .view-mode-group { display: flex; gap: 6px; background: rgba(0,0,0,0.4); padding: 4px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .mode-btn {
            background: transparent; border: none; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; color: rgba(255,255,255,0.6); transition: 0.2s;
        }
        .mode-btn.active { background: var(--app-orange); color: #000; box-shadow: 0 2px 8px rgba(255,122,0,0.4); }

        .header-datetime { font-size: 15px; color: #ffab40; font-weight: 600; background: rgba(0,0,0,0.3); padding: 6px 14px; border-radius: 10px; }
        .header-actions { display: flex; gap: 12px; align-items: center; }

        .control-btn {
            color: white; border: none; padding: 8px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: all 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .audio-btn {
            background: rgba(48, 209, 88, 0.2); color: var(--app-green); border: 1px solid rgba(48, 209, 88, 0.4);
        }
        .audio-btn.active { background: var(--app-green); color: #000; }

        .saver-btn {
            background: rgba(123, 44, 191, 0.2); color: #d8b4fe; border: 1px solid rgba(123, 44, 191, 0.4);
        }
        .saver-btn:hover { background: rgba(123, 44, 191, 0.4); }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            max-width: 1900px;
            margin: 0 auto;
        }
        @media(max-width: 1200px) { .main-layout { grid-template-columns: 1fr; } }

        .monitor-container {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); 
            gap: 20px;
            align-content: start;
        }

        .monitor-card {
            background: var(--app-card); backdrop-filter: blur(25px);
            border-radius: 24px; padding: 20px; position: relative;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6); border: 1px solid var(--app-border); 
            border-left: 10px solid var(--app-orange); display: flex; flex-direction: column; justify-content: space-between;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        .card-top { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px; margin-bottom: 10px; }
        .card-bed { background: var(--app-orange); color: #000; padding: 4px 12px; border-radius: 8px; font-size: 18px; font-weight: 800; }
        
        .card-patient h3 { margin: 0; font-size: 22px; font-weight: 700; color: #fff; }
        .card-patient p { margin: 4px 0 0; font-size: 14px; color: rgba(255,255,255,0.6); }
        .card-patient .diag-text { color: #ffd60a; font-weight: 600; }

        .card-procedure {
            background: rgba(255, 122, 0, 0.15); padding: 10px; border-radius: 10px;
            font-size: 16px; font-weight: 700; text-align: center; margin-bottom: 10px; color: #ffab40;
            border: 1px dashed rgba(255, 122, 0, 0.4);
        }

        .card-timer {
            background: rgba(0, 0, 0, 0.4); padding: 8px; border-radius: 10px; text-align: center;
            font-size: 20px; font-weight: 800; color: var(--app-green); margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .card-timer.time-up { color: var(--app-red); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .card-details { font-size: 13px; margin-bottom: 10px; background: rgba(0, 0, 0, 0.25); padding: 8px 12px; border-radius: 10px; }
        .card-details div span { color: rgba(255,255,255,0.5); }

        .card-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px; gap: 6px; }
        
        /* สไตล์กรอบและรูปผู้ทำหัตถการ (Blended Avatar - ใช้พื้นที่ 50% ของกรอบวงกลมกลืนกับพื้นหลัง) */
        .card-operator { display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .operator-avatar-frame {
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(123, 44, 191, 0.3);
            border: 1px solid rgba(255, 122, 0, 0.4);
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden; flex-shrink: 0;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .operator-avatar-frame img {
            width: 50%; height: 50%; object-fit: cover; border-radius: 50%;
            mix-blend-mode: luminosity; opacity: 0.85;
            transition: 0.3s ease;
        }
        .card-operator:hover .operator-avatar-frame img {
            mix-blend-mode: normal; opacity: 1; transform: scale(1.1);
        }

        .card-btn-group { display: flex; gap: 6px; }
        .btn-call {
            background: rgba(14, 165, 233, 0.2); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.4);
            padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700;
        }
        .btn-call:hover { background: #0ea5e9; color: #fff; }

        .btn-done { 
            background: rgba(255, 69, 58, 0.2); color: var(--app-red); border: 1px solid rgba(255, 69, 58, 0.4); 
            padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700;
        }
        .btn-done:hover { background: var(--app-red); color: #fff; }

        .sidebar-waitlist {
            background: rgba(30, 15, 45, 0.9);
            border: 1px solid rgba(123, 44, 191, 0.4);
            border-radius: 24px;
            padding: 20px;
            max-height: calc(100vh - 120px);
            display: flex;
            flex-direction: column;
        }
        .sidebar-title {
            font-size: 18px; font-weight: 700; color: #d8b4fe; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;
        }
        .waitlist-items {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }
        .waitlist-card {
            background: rgba(61, 28, 79, 0.6);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .waitlist-info h5 { margin: 0 0 4px 0; font-size: 15px; color: #fff; }
        .waitlist-info p { margin: 0; font-size: 12px; color: rgba(255,255,255,0.6); }
        .btn-start-wait {
            background: var(--app-orange); color: #fff; border: none; padding: 6px 10px;
            border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
        }
        .btn-start-wait:hover { background: #e56d00; }

        #screenSaverOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #0a0410 100%);
            z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            opacity: 0; pointer-events: none; transition: opacity 0.8s ease-in-out;
        }
        #screenSaverOverlay.active { opacity: 1; pointer-events: auto; }
        .saver-content { animation: floatSlow 6s ease-in-out infinite alternate; }
        .saver-logo { font-size: 70px; color: var(--app-orange); margin-bottom: 20px; text-shadow: 0 0 30px rgba(255, 122, 0, 0.4); }
        .saver-title { font-size: 42px; font-weight: 800; color: #fff; margin: 0 0 10px 0; letter-spacing: 1px; }
        .saver-subtitle { font-size: 20px; color: #b794f4; font-weight: 400; margin-bottom: 40px; }
        .saver-clock {
            font-size: 64px; font-weight: 800; color: #ffab40;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 40px; border-radius: 20px; backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: inline-block;
        }
        @keyframes floatSlow { 0% { transform: translateY(0px); } 100% { transform: translateY(-15px); } }
    </style>
</head>
<body>

    <div id="screenSaverOverlay" onclick="toggleManualScreenSaver()">
        <div class="saver-content">
            <div class="saver-logo"><i class="fa-solid fa-hospital-user"></i></div>
            <h1 class="saver-title">ระบบหัตถการแพทย์แผนไทย</h1>
            <p class="saver-subtitle">พร้อมให้บริการผู้ป่วยทุกท่าน • แตะหน้าจอเพื่อกลับสู่หน้าจอหลัก</p>
            <div class="saver-clock" id="saverClock">00:00:00</div>
        </div>
    </div>

    <div class="header-container">
        <div class="header-title">
            <i class="fa-solid fa-desktop" style="color: var(--app-orange);"></i> Live Treatment Dashboard
        </div>

        <div class="view-mode-group">
            <button class="mode-btn active" id="modeBtnInside" onclick="switchViewMode('inside')">🏥 ในสถานบริการ</button>
            <button class="mode-btn" id="modeBtnOutside" onclick="switchViewMode('outside')">🚗 นอกสถานบริการ (นอกพื้นที่)</button>
        </div>

        <div class="header-datetime" id="liveDateTime">กำลังโหลดวันเวลา...</div>
        <div class="header-actions">
            <button class="control-btn saver-btn" onclick="toggleManualScreenSaver()">
                <i class="fa-solid fa-moon"></i> พักหน้าจอ
            </button>
            <button id="audioToggleBtn" class="control-btn audio-btn" onclick="initAudio()">
                <i class="fa-solid fa-volume-xmark"></i> เปิดเสียง
            </button>
        </div>
    </div>

    <div class="main-layout">
        <div class="monitor-container" id="monitorQueue"></div>

        <div class="sidebar-waitlist">
            <div class="sidebar-title">
                <span><i class="fa-solid fa-clock-rotate-left"></i> ผู้ป่วยรอคิว (Waiting List)</span>
                <span id="waitCount" style="font-size: 14px; color: #ffab40;">(0)</span>
            </div>
            <div class="waitlist-items" id="waitlistContainer">
                <div style="text-align: center; color: rgba(255,255,255,0.4); padding: 30px; font-size: 14px;">ยังไม่มีคิวรอ</div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDY8iVK3odMUspUk4gSrzzwJUvx2EycCyg",
    		authDomain: "thai-med-monitor.firebaseapp.com",
    		projectId: "thai-med-monitor",
    		storageBucket: "thai-med-monitor.firebasestorage.app",
    		messagingSenderId: "894864632905",
    		appId: "1:894864632905:web:521452d40ea00653a72398",
    		measurementId: "G-7SXZRHE5F9"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const queueRef = database.ref('patientQueue');

        let previousKeys = [];
        let notifiedTimeUpKeys = [];
        let soundEnabled = false;
        let currentQueueData = {};
        let currentViewMode = 'inside';
        let manualSaverActive = false;

        // แมปชื่อผู้ปฏิบัติงานกับไฟล์รูปภาพในโฟลเดอร์ imsges/staff-1.jpg ถึง staff-12.jpg
        const operatorStaffList = [
            "กรชกร พองผาลา", "สุประภา มาละอินทร์", "พรวินิจ แก้วอัคฮาด", "พรสิน เฮียงราช",
            "พฤษาพันธ์ บุบผาลา", "จิรวัฒณ์ สีตาแสน", "ฐิติมา บุญแฮด", "ฉัตรลดา หงษ์วิลัย",
            "ประกายรัตน์ กาลสุข", "นพวินทร์ จิรศศิภิรมย์", "สุนิสา อินทะเสย์", "นายแพทย์กฤตธนัท วงค์วิเศษ"
        ];

        function getStaffImagePath(operatorName) {
            let cleanName = operatorName.replace(/^\d+\./, '').trim();
            let index = operatorStaffList.findIndex(s => s.includes(cleanName) || cleanName.includes(s));
            if (index !== -1) {
                return `imsges/staff-${index + 1}.jpg`;
            }
            return ''; // ถ้าไม่พบจะให้ระบบใช้ fallback รูปวาด SVG เดิม
        }

        function updateDateTime() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            let dateStr = now.toLocaleDateString('th-TH', options);
            let timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            document.getElementById('liveDateTime').innerHTML = `<i class="fa-regular fa-calendar-days"></i> ${dateStr} | <i class="fa-regular fa-clock"></i> ${timeStr}`;
            
            const saverClockEl = document.getElementById('saverClock');
            if (saverClockEl) {
                saverClockEl.innerText = timeStr;
            }
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        function initAudio() {
            soundEnabled = true;
            const btn = document.getElementById('audioToggleBtn');
            btn.innerHTML = '<i class="fa-solid fa-volume-high"></i> เสียงเปิดอยู่';
            btn.classList.add('active');
            speakText("ระบบเสียงพร้อมใช้งานค่ะ");
        }

        function speakText(text) {
            if (!soundEnabled) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function repeatCallPatient(pname, bed, operator, queueNo) {
            let qStr = queueNo ? `หมายเลขคิว ${queueNo}` : '';
            let announcement = `ขอเชิญ ${qStr} คุณ ${pname}, ที่ ${bed}, ผู้ปฏิบัติงาน ${operator}`;
            speakText(announcement);
        }

        function toggleManualScreenSaver() {
            manualSaverActive = !manualSaverActive;
            const screenSaver = document.getElementById('screenSaverOverlay');
            if (manualSaverActive) {
                screenSaver.classList.add('active');
            } else {
                screenSaver.classList.remove('active');
            }
        }

        function switchViewMode(mode) {
            currentViewMode = mode;
            const btnInside = document.getElementById('modeBtnInside');
            const btnOutside = document.getElementById('modeBtnOutside');

            if (mode === 'inside') {
                btnInside.classList.add('active');
                btnOutside.classList.remove('active');
            } else {
                btnOutside.classList.add('active');
                btnInside.classList.remove('active');
            }
            renderDashboard();
        }

        function removePatient(key) {
            queueRef.child(key).remove();
        }

        function startWaitingPatient(key) {
            queueRef.child(key).update({ 
                status: 'active',
                timestamp: 0 - Date.now(),
                endTime: Date.now() + (30 * 60 * 1000)
            });
            manualSaverActive = false;
        }

        queueRef.orderByChild('timestamp').on('value', (snapshot) => {
            currentQueueData = snapshot.val() || {};
            renderDashboard();
        });

        function renderDashboard() {
            const container = document.getElementById('monitorQueue');
            const waitlistContainer = document.getElementById('waitlistContainer');
            const screenSaver = document.getElementById('screenSaverOverlay');
            
            let keys = Object.keys(currentQueueData);

            keys.sort((a, b) => {
                let timeA = currentQueueData[a].timestamp || 0;
                let timeB = currentQueueData[b].timestamp || 0;
                return timeA - timeB;
            });

            let allActiveKeys = keys.filter(k => currentQueueData[k].status === 'active' || !currentQueueData[k].status);
            let waitingKeys = keys.filter(k => currentQueueData[k].status === 'waiting');

            let activeKeys = allActiveKeys.filter(k => {
                let p = currentQueueData[k];
                let isOutsideBed = (p.bed === 'นอกพื้นที่');
                if (currentViewMode === 'inside') {
                    return !isOutsideBed;
                } else {
                    return isOutsideBed;
                }
            });

            if ((allActiveKeys.length === 0 && waitingKeys.length === 0) || manualSaverActive) {
                screenSaver.classList.add('active');
            } else {
                screenSaver.classList.remove('active');
            }

            document.getElementById('waitCount').innerText = `(${waitingKeys.length})`;

            if (soundEnabled && allActiveKeys.length > 0) {
                let newActive = allActiveKeys.filter(k => !previousKeys.includes(k));
                if (newActive.length > 0) {
                    let latestKey = newActive[0];
                    let p = currentQueueData[latestKey];
                    let qStr = p.queueNo ? `คิว ${p.queueNo}` : '';
                    let announcement = `${qStr} ผู้ป่วย ${p.pname}, ที่ ${p.bed}, ผู้ปฏิบัติงาน ${p.operator}`;
                    setTimeout(() => { speakText(announcement); }, 500);
                }
            }
            previousKeys = [...keys];

            if (activeKeys.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; color: rgba(255,255,255,0.3); background: rgba(30, 15, 45, 0.8); border-radius: 24px; border: 2px dashed rgba(255, 122, 0, 0.2); font-size: 18px; padding: 50px;">
                        <i class="fa-solid fa-bed-pulse fa-3x" style="margin-bottom: 15px; color: var(--app-orange);"></i><br>
                        ไม่มีเคสกำลังทำหัตถการในโหมด (${currentViewMode === 'inside' ? 'ในสถานบริการ' : 'นอกสถานบริการ / นอกพื้นที่'})
                    </div>`;
            } else {
                let html = '';
                activeKeys.forEach((key) => {
                    let p = currentQueueData[key];
                    let timeLeftMs = p.endTime - Date.now();
                    let isTimeUp = timeLeftMs <= 0;
                    
                    let timeStr = "";
                    if (!isTimeUp) {
                        let minutes = Math.floor(timeLeftMs / 60000);
                        let seconds = Math.floor((timeLeftMs % 60000) / 1000);
                        timeStr = `คงเหลือ: ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')} นาที`;
                    } else {
                        let overdueMs = Math.abs(timeLeftMs);
                        let ovMinutes = Math.floor(overdueMs / 60000);
                        let ovSeconds = Math.floor((overdueMs % 60000) / 1000);
                        timeStr = `เกินเวลา +${String(ovMinutes).padStart(2, '0')}:${String(ovSeconds).padStart(2, '0')} นาที`;
                    }

                    let qBadge = p.queueNo ? `<span style="background:var(--app-purple); color:#fff; padding:2px 8px; border-radius:6px; font-size:14px; margin-right:6px;">คิว: ${p.queueNo}</span>` : '';
                    let staffImgPath = getStaffImagePath(p.operator);

                    // สร้าง Tag รูปภาพ หรือ fallback เป็น SVG หากยังไม่มีไฟล์ใน folder imsges
                    let avatarHtml = staffImgPath 
                        ? `<img src="${staffImgPath}" alt="${p.operator}" onerror="this.onerror=null; this.src='${p.avatar}';">`
                        : `<img src="${p.avatar}" alt="${p.operator}">`;

                    html += `
                        <div class="monitor-card" id="card-${key}">
                            <div class="card-top">
                                <div class="card-patient">
                                    <h3>${qBadge} ${p.pname}</h3>
                                    <p>HN: ${p.hn} | วินิจฉัย: <span class="diag-text">${p.diagnosis}</span></p>
                                </div>
                                <div class="card-bed">${p.bed}</div>
                            </div>

                            <div class="card-procedure">
                                <i class="fa-solid fa-hands-asl-interpreting"></i> ${p.procedure}
                            </div>

                            <div class="card-timer ${isTimeUp ? 'time-up' : ''}" id="timer-${key}">
                                <i class="fa-regular fa-clock"></i> ${timeStr}
                            </div>

                            <div class="card-details">
                                <div><span>โรคประจำตัว:</span> ${p.disease}</div>
                                <div style="color:#ffb3b3;"><span>ข้อควรระวัง:</span> ${p.caution}</div>
                            </div>

                            <div class="card-footer">
                                <div class="card-operator">
                                    <div class="operator-avatar-frame">
                                        ${avatarHtml}
                                    </div>
                                    <span>ผู้ปฏิบัติงาน: <b>${p.operator}</b></span>
                                </div>
                                <div class="card-btn-group">
                                    <button class="btn-call" onclick="repeatCallPatient('${p.pname}', '${p.bed}', '${p.operator}', '${p.queueNo || ''}')" title="กดเรียกคิวซ้ำ">
                                        <i class="fa-solid fa-volume-high"></i> เรียก
                                    </button>
                                    <button class="btn-done" onclick="removePatient('${key}')">
                                        <i class="fa-solid fa-check"></i> เสร็จสิ้น
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }

            if (waitingKeys.length === 0) {
                waitlistContainer.innerHTML = `<div style="text-align: center; color: rgba(255,255,255,0.4); padding: 30px; font-size: 14px;">ยังไม่มีคิวรอ</div>`;
            } else {
                let waitHtml = '';
                waitingKeys.forEach((key) => {
                    let p = currentQueueData[key];
                    let qBadge = p.queueNo ? `[คิว: ${p.queueNo}]` : '';
                    waitHtml += `
                        <div class="waitlist-card">
                            <div class="waitlist-info">
                                <h5><span style="color:#ffab40;">${qBadge}</span> ${p.pname}</h5>
                                <p>เตียง: ${p.bed} | ${p.procedure}</p>
                            </div>
                            <button class="btn-start-wait" onclick="startWaitingPatient('${key}')">เริ่มทำ</button>
                        </div>
                    `;
                });
                waitlistContainer.innerHTML = waitHtml;
            }
        }

        setInterval(() => {
            let keys = Object.keys(currentQueueData);
            if (keys.length > 0) {
                keys.forEach((key) => {
                    let p = currentQueueData[key];
                    if (p.status === 'active' || !p.status) {
                        let timeLeftMs = p.endTime - Date.now();
                        let isTimeUp = timeLeftMs <= 0;

                        let isDrKrittanat = p.operator && p.operator.includes("นายแพทย์กฤตธนัท วงค์วิเศษ");
                        if (isTimeUp && isDrKrittanat) {
                            if (soundEnabled && !notifiedTimeUpKeys.includes(key)) {
                                speakText(`หมดเวลาหัตถการของแพทย์กฤตธนัท ที่ ${p.bed}`);
                                notifiedTimeUpKeys.push(key);
                            }
                            removePatient(key);
                            return;
                        }

                        if (isTimeUp) {
                            let overdueMs = Math.abs(timeLeftMs);
                            const gracePeriodMs = 5 * 60 * 1000;

                            if (overdueMs >= gracePeriodMs) {
                                removePatient(key);
                                return;
                            }

                            if (soundEnabled && !notifiedTimeUpKeys.includes(key)) {
                                speakText(`หมดเวลาทำหัตถการ ที่ ${p.bed}`);
                                notifiedTimeUpKeys.push(key);
                            }
                        }

                        let timerEl = document.getElementById(`timer-${key}`);
                        if (timerEl) {
                            let timeStr = "";
                            if (!isTimeUp) {
                                let minutes = Math.floor(timeLeftMs / 60000);
                                let seconds = Math.floor((timeLeftMs % 60000) / 1000);
                                timeStr = `คงเหลือ: ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')} นาที`;
                            } else {
                                let overdueMs = Math.abs(timeLeftMs);
                                let ovMinutes = Math.floor(overdueMs / 60000);
                                let ovSeconds = Math.floor((overdueMs % 60000) / 1000);
                                timeStr = `เกินเวลา +${String(ovMinutes).padStart(2, '0')}:${String(ovSeconds).padStart(2, '0')} นาที`;
                            }
                            
                            timerEl.innerHTML = `<i class="fa-regular fa-clock"></i> ${timeStr}`;
                            if (isTimeUp) {
                                timerEl.classList.add('time-up');
                            }
                        }
                    }
                });
            }
        }, 1000);
    </script>
</body>
</html>
